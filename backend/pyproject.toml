[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "animetron-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
strict = true
